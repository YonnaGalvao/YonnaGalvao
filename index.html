<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Montserrat', sans-serif;

  min-height:100vh;

  background:
  linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)),
  url("bg.jpg");

  background-size:cover;
  background-position:center;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;

  color:white;
}

/* CONTAINER */

.container{

  width:100%;
  max-width:420px;

  padding:20px;

  text-align:center;
}

/* TÍTULO */

.titulo{

  margin-bottom:25px;
  
}

.logo-nome{

  width:320px;

  max-width:90%;

  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.25));
}

.titulo p{

  font-size:16px;

  font-weight:800;

  color:#b8f5a8;

  letter-spacing:2px;

  margin-top:5px;

  text-transform:uppercase;

  text-shadow:0 2px 8px rgba(0,0,0,0.25);
}

/* REDES */

.redes{

  display:flex;

  justify-content:center;

  gap:18px;

  margin:420px 0 20px;
}

.redes img{

  width:55px;

  height:55px;

  transition:.3s;

  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.25));
}

.redes img:hover{

  transform:scale(1.1);
}

/* TEXTO */

.frase{

  font-size:14px;

  font-weight:700;

  letter-spacing:2px;

  margin-top:30px;

  margin-bottom:25px;

  text-shadow:0 2px 8px rgba(0,0,0,0.25);
}

/* BOTÕES */

.botao{
  width:75%;
  height:35px;

  border-radius:10px;
  margin:0 auto 15px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;

  text-decoration:none;

  font-weight:700;
  letter-spacing:2px;
  font-size:13px;

  transition:.3s;
}

/* BOTÃO VERDE */

.verde{
  background:#34d06f;
  color:white;
}

/* BOTÕES PREMIUM */

.botoes{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:16px;

  margin-top:20px;
}

.botoes img{

  width:63px;

  height:auto;

  transition:.3s;

  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.25));
}

.botoes img:hover{

  transform:scale(1.1);

  filter:drop-shadow(0 0 12px rgba(255,255,255,0.5));
}

/* RODAPÉ */

.rodape{

  width:100%;

  text-align:center;

  padding:15px 10px;

  font-size:12px;

  font-weight:500;

  color:white;

  background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
}

/* RESPONSIVO */

@media(max-width:480px){

  .logo-nome{
    margin-top:280px;
    width:400px;
  }

  .titulo p{

    font-size:13px;
  }

  .redes{

    margin-top:110px;

    gap:15px;
  }

  .redes img{

    width:50px;

    height:50px;
  }

  .botoes{

    gap:12px;
  }

  .botoes img{

    width:57px;
  }

}

</style>
</head>

<body>

<div class="container">
